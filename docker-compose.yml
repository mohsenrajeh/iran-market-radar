services:
  postgres:
    image: postgres:16-alpine
    container_name: iran_market_radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iran_market_radar
      POSTGRES_USER: radar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${RADAR_POSTGRES_PORT:-5742}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_user -d iran_market_radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iran_market_radar_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${RADAR_REDIS_PORT:-6742}:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: iran_market_radar_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_PORT: 8742
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      RISK_KILL_SWITCH_ARMED: "true"
      INITIAL_PORTFOLIO_CASH_RIALS: 100000000000
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      RADAR_ADMIN_USER: ${RADAR_ADMIN_USER:?RADAR_ADMIN_USER must be set in .env}
      RADAR_ADMIN_PASSWORD: ${RADAR_ADMIN_PASSWORD:?RADAR_ADMIN_PASSWORD must be set in .env}
      # Local Dev defaults to HTTP; Production sets COOKIE_SECURE=true behind
      # its HTTPS reverse proxy without changing the image or compose file.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    ports:
      - "127.0.0.1:${APP_PORT:-8742}:${APP_PORT:-8742}"
    volumes:
      - ./packages:/app/packages
      - ./services:/app/services
      - ./apps/api:/app/apps/api
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --max-time 3 http://127.0.0.1:8742/api/v1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: iran_market_radar_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: "http://api:${APP_PORT:-8742}/api/v1/:path*"
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3742}:3000"

volumes:
  postgres_data:
  redis_data:
