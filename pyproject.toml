[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iran-market-radar"
version = "1.0.0"
description = "Institutional-grade Iran Stock Market opportunity scanner, backtester and paper trading platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Iran Market Radar Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "polars>=0.20.15",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.1",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "jdatetime>=5.0.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
